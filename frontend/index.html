<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honeypot Admin Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        h1 { color: #bb86fc; text-align: center; }
        .container { max-width: 1200px; margin: 0 auto; }
        .stats { display: flex; justify-content: space-around; margin-bottom: 30px; background-color: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .stat-box { text-align: center; }
        .stat-value { font-size: 2em; font-weight: bold; color: #03dac6; }
        table { width: 100%; border-collapse: collapse; background-color: #1e1e1e; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #333; }
        th { background-color: #2c2c2c; color: #bb86fc; font-weight: 600; }
        tr:hover { background-color: #2a2a2a; }
        .method { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.9em; }
        .GET { background-color: #4CAF50; color: white; }
        .POST { background-color: #2196F3; color: white; }
        .PUT { background-color: #FF9800; color: white; }
        .DELETE { background-color: #f44336; color: white; }
        .path-cell { word-break: break-all; max-width: 250px; }
        .body-cell { font-family: monospace; font-size: 0.85em; color: #a5d6ff; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍯 Honeypot Activity Dashboard</h1>
        
        <div class="stats">
            <div class="stat-box">
                <div class="stat-value" id="total-requests">0</div>
                <div>Total Requests Caught</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="unique-ips">0</div>
                <div>Unique Attacker IPs</div>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>IP Address</th>
                    <th>Method</th>
                    <th>Path Targeted</th>
                    <th>User Agent</th>
                    <th>Payload/Body</th>
                </tr>
            </thead>
            <tbody id="logs-body">
                <!-- Logs will be inserted here -->
            </tbody>
        </table>
    </div>

    <script>
        async function fetchLogs() {
            try {
                // Assuming the frontend runs on the same domain/port as the backend API or via proxy
                // If running separately, you might need CORS configured and full URL here
                const response = await fetch('http://localhost:8000/api/logs');
                const logs = await response.json();
                
                document.getElementById('total-requests').innerText = logs.length;
                
                const uniqueIps = new Set(logs.map(log => log.ip_address));
                document.getElementById('unique-ips').innerText = uniqueIps.size;

                const tbody = document.getElementById('logs-body');
                tbody.innerHTML = '';

                logs.forEach(log => {
                    const tr = document.createElement('tr');
                    
                    const date = new Date(log.timestamp).toLocaleString();
                    const methodClass = log.method.toUpperCase();
                    
                    // Simple body truncation for display
                    let displayBody = log.body || 'None';
                    if(displayBody.length > 50) displayBody = displayBody.substring(0, 50) + '...';

                    tr.innerHTML = `
                        <td>${date}</td>
                        <td style="color: #ffb74d; font-family: monospace;">${log.ip_address}</td>
                        <td><span class="method ${methodClass}">${log.method}</span></td>
                        <td class="path-cell">${log.path}</td>
                        <td style="font-size: 0.85em; color: #9e9e9e;">${log.user_agent}</td>
                        <td class="body-cell" title="${log.body ? log.body.replace(/"/g, '&quot;') : ''}">${displayBody}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Error fetching logs:', error);
                document.getElementById('logs-body').innerHTML = '<tr><td colspan="6" style="text-align:center; color:#f44336;">Error loading data. Make sure backend is running on port 8000.</td></tr>';
            }
        }

        // Fetch initially and then every 5 seconds
        fetchLogs();
        setInterval(fetchLogs, 5000);
    </script>
</body>
</html>
